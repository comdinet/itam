services:
  # TLS terminator. Everything reaches the app through here.
  caddy:
    image: caddy:2-alpine
    container_name: itam-caddy
    restart: unless-stopped
    ports:
      - "${ITAM_HTTP_PORT:-80}:80"     # needed for ACME challenges and the redirect to HTTPS
      - "${ITAM_HTTPS_PORT:-443}:443"
    environment:
      ITAM_SITE_ADDRESS: ${ITAM_SITE_ADDRESS:-localhost}
      ITAM_TLS: ${ITAM_TLS:-internal}
      # Falls back to the first listed name for clients that send no SNI.
      ITAM_DEFAULT_SNI: ${ITAM_DEFAULT_SNI:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # issued certificates - must persist across restarts
      - caddy_config:/config
    depends_on:
      itam:
        # Wait for the app to pass its health check, so the first request
        # after a deploy never lands on a 502.
        condition: service_healthy

  itam:
    build: .
    image: itam:latest
    container_name: itam
    restart: unless-stopped
    # Bound to loopback only: the outside world comes in via Caddy over HTTPS.
    ports:
      - "127.0.0.1:${ITAM_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Always inside the mounted volume, whatever .env says.
      ITAM_DB: /data/itam.db
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
