<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &middot; ITAM</title>
<link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
</head>
<body class="centered">
<main class="signin">
  <h1>ITAM</h1>
  <p class="meta">IT asset &amp; subscription tracking</p>
  {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
  {% if sso %}
  <a class="btn sso" href="/saml/login?next={{ next|urlencode }}">Sign in with Microsoft</a>
  <div class="or"><span>or sign in with a local account</span></div>
  {% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username
      <input name="username" autocomplete="username" autofocus required></label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
