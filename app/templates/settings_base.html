{% extends "base.html" %}
{% block body %}
<h1>Settings</h1>
<nav class="subnav">
  <a href="/settings" {% if section == 'general' %}class="on"{% endif %}>General</a>
  <a href="/settings/entra" {% if section == 'entra' %}class="on"{% endif %}>Entra ID</a>
  <a href="/settings/groups" {% if section == 'groups' %}class="on"{% endif %}>Groups</a>
  <a href="/settings/devices" {% if section == 'devices' %}class="on"{% endif %}>Devices</a>
  <a href="/settings/licences" {% if section == 'licences' %}class="on"{% endif %}>Licences</a>
  <a href="/settings/currencies" {% if section == 'currencies' %}class="on"{% endif %}>Currencies</a>
  <a href="/settings/pricing" {% if section == 'pricing' %}class="on"{% endif %}>Pricing</a>
  <a href="/settings/rules" {% if section == 'rules' %}class="on"{% endif %}>Rules</a>
  <a href="/settings/import" {% if section == 'import' %}class="on"{% endif %}>Import</a>
  {% if me and me.is_admin %}
    <a href="/settings/accounts" {% if section == 'accounts' %}class="on"{% endif %}>Accounts</a>
    <a href="/settings/sso" {% if section == 'sso' %}class="on"{% endif %}>SSO</a>
    <a href="/settings/api" {% if section == 'api' %}class="on"{% endif %}>API</a>
  {% endif %}
  <a href="/account">My account</a>
</nav>
{% block admin %}{% endblock %}
{% endblock %}
